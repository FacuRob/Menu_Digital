<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#efede6" />
    <title>DinexFlow · Tu negocio es Dinex</title>
    <meta
      name="description"
      content="Tu página con productos, servicios, presupuestos y turnos, con QR y link. Tus clientes compran, piden o reservan desde el celular; vos manejás todo desde un panel. Probalo gratis 15 días, sin tarjeta."
    />
    <!-- Vista previa al compartir el link (WhatsApp, Instagram, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="DinexFlow" />
    <meta property="og:title" content="DinexFlow · Tu negocio es Dinex" />
    <meta
      property="og:description"
      content="Tu página con productos, servicios, presupuestos y turnos. Probalo gratis 15 días, sin tarjeta."
    />
    <meta name="twitter:card" content="summary" />
    <!-- Color de fondo desde el primer instante (sin flash): hueso en la
         landing, oscuro en el menú público. -->
    <style>
      html, body { background: #060912; margin: 0; }
      html.dx-home, html.dx-home body { background: #efede6; }
    </style>
    <script>
      if (location.pathname === "/" || /^\/(ticket|reparto|seguimiento)\//.test(location.pathname)) document.documentElement.classList.add("dx-home");
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
